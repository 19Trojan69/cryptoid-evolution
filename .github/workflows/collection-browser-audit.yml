name: Collection browser audit
on:
  push:
    branches: [codex/collection-audit-20261005]
    paths: ['.github/workflows/collection-browser-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: collection-browser-audit
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply only the reviewed source patch
        shell: bash
        run: |
          mkdir -p audit-output
          python3 - <<'PY'
          import pathlib,base64,lzma,hashlib,subprocess
          root=pathlib.Path('.audit-transfer')
          encoded=''.join((root/f'collection-patch.{i}.b64').read_text().strip() for i in (1,2,3))
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='4c67ede3a59b3d408ea41503b75c123fd7ff3d02cde217597a4347f673f6a949'
          for line in patch.decode().splitlines():
              if line.startswith('+++ '): assert line.startswith('+++ b/frontend/'),line
          pathlib.Path('/tmp/collection-reviewed.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','--index','/tmp/collection-reviewed.patch'],check=True)
          subprocess.run(['git','apply','--index','/tmp/collection-reviewed.patch'],check=True)
          PY
          git diff --cached --stat | tee audit-output/source-changes.txt
      - name: Install app dependencies
        run: npm install --prefix frontend --no-audit --no-fund && npm install --prefix backend --no-audit --no-fund
      - name: Backend build
        run: set -o pipefail; npm run build --prefix backend 2>&1 | tee audit-output/backend-build.txt
      - name: Backend tests
        working-directory: backend
        run: set -o pipefail; find src -name '*.test.mjs' -print0 | xargs -0 node --experimental-strip-types --test 2>&1 | tee ../audit-output/backend-tests.txt
      - name: Frontend tests
        working-directory: frontend
        run: set -o pipefail; find src -name '*.test.mjs' -print0 | xargs -0 node --experimental-strip-types --test 2>&1 | tee ../audit-output/frontend-tests.txt
      - name: Frontend production build
        run: set -o pipefail; npm run build --prefix frontend 2>&1 | tee audit-output/frontend-build.txt
      - name: Install isolated browser tools
        run: |
          npm install --prefix .audit-tools --no-save --no-audit --no-fund playwright@1.56.1
          .audit-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify purchases, silhouettes, responsive footers and all PNG texts
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ github.workspace }}/.audit-tools/node_modules/playwright
        run: set -o pipefail; node frontend/scripts/verifyCollectionAudit.cjs 2>&1 | tee audit-output/browser-log.txt
      - name: Commit tested source on the isolated audit branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = 'codex/collection-audit-20261005'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix complete boss cards, durable acquisition and full-text exports; prepare honest 110-card asset registry'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          git rev-parse HEAD | tee audit-output/verified-commit.txt
      - name: Save evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-browser-evidence-${{ github.run_id }}
          path: audit-output/
          retention-days: 7
