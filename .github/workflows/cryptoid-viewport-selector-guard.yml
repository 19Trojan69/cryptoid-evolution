name: Verify unchanged viewport with gated fallback selectors
on:
  push:
    branches: [codex/viewport-selector-guard-20261105]
    paths:
      - '.github/workflows/cryptoid-viewport-selector-guard.yml'
      - 'verification/viewport-selector-guard-20261105/**'
permissions:
  contents: read
concurrency:
  group: viewport-selector-guard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: {engine: [chromium, webkit]}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24'}
      - name: Require unchanged source and exact two-selector scope
        run: |
          node --test verification/viewport-selector-guard-20261105/transform.test.mjs
          node --check verification/viewport-selector-guard-20261105/run.mjs
          node verification/direct-boss-style-device-20261102/verifyScope.mjs
      - name: Install existing native browser fixture
        run: |
          npm install --prefix verification/boss2-forensics-20261028 --ignore-scripts --no-audit --no-fund
          cd verification/boss2-forensics-20261028
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Verify layout and native dependency work
        run: node verification/viewport-selector-guard-20261105/run.mjs ${{ matrix.engine }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: viewport-selector-guard-${{ matrix.engine }}
          path: verification/viewport-selector-guard-20261105/results/
          retention-days: 7
