name: Transition resource diagnosis validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/transition-resource-diagnosis-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Reload and resource diagnostics tests
        run: node --experimental-strip-types --test src/pages/reloadDiagnostics.test.mjs src/pages/resourceCacheDiagnostics.test.mjs
      - name: Stability and owner tests
        run: node --experimental-strip-types --test scripts/stabilityReport.test.mjs scripts/ownerStabilityReport.test.mjs src/pages/gameLoop.test.mjs src/pages/diagnosticExport.test.mjs
