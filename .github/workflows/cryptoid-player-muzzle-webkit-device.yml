name: Verify localized muzzle light with the existing critical journal
on:
  push:
    branches: [codex/muzzle-scope-device-20261105]
    paths:
      - '.github/workflows/cryptoid-player-muzzle-webkit-device.yml'
      - 'verification/player-muzzle-webkit-device-20261105/**'
      - 'verification/direct-boss-style-device-20261102/buildDevicePreview.mjs'
permissions:
  contents: read
jobs:
  scope-and-journal-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: {engine: [chromium, webkit]}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24'}
      - name: Check the exact source changes
        run: |
          node --test verification/player-muzzle-webkit-device-20261105/transform.test.mjs
          node verification/direct-boss-style-device-20261102/verifyScope.mjs
      - name: Install the existing frozen guest and native browser
        env: {VERCEL_ENV: preview}
        run: |
          node verification/direct-boss-style-device-20261102/installDevicePreview.mjs --ignore-scripts
          npm install --prefix verification/boss2-forensics-20261028 --ignore-scripts --no-audit --no-fund
          cd verification/boss2-forensics-20261028
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Build only the localized existing writer with unchanged journal modules
        env: {VERCEL_ENV: preview}
        run: node verification/player-muzzle-webkit-device-20261105/build.mjs
      - name: Verify native presentation, variable reach and normal journal export
        env: {VERCEL_ENV: preview}
        run: node verification/player-muzzle-webkit-device-20261105/run.mjs ${{ matrix.engine }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: muzzle-webkit-journal-${{ matrix.engine }}
          path: verification/player-muzzle-webkit-device-20261105/results/
          retention-days: 7
