name: Temporary Paket 7 localization diagnostics
on:
  push:
    branches: [codex/package-7-localization]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix frontend --ignore-scripts --no-audit --no-fund
      - run: npm run build --prefix frontend
