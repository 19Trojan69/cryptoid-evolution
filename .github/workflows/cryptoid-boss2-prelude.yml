name: Compare audio restart at level completion
on:
  push:
    branches: [codex/memory-monitor-lab-20261106]
    paths:
      - 'verification/boss2-prelude-20261107/*.mjs'
      - '.github/workflows/cryptoid-boss2-prelude.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        order: [restart-first, keep-clock-first]
        pair: [1, 2]
    container:
      image: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24'}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify pinned lab and game trees
        run: |
          test "$(git rev-parse HEAD:frontend)" = 6e0cdc1bea4b6c84972382f636fa66caf2739010
          test "$(git rev-parse HEAD:verification/memory-monitor-lab-20261106)" = 4c58d3868bdce1d8a582e2d54a70e8cf24223b64
      - run: npm install --prefix frontend --include=optional --ignore-scripts --no-audit --no-fund
      - run: npm install --prefix verification/transition-motion-20261106 --ignore-scripts --no-audit --no-fund
      - run: node --test verification/memory-monitor-lab-20261106/model.test.mjs frontend/src/pages/completionAudioResume.test.mjs
      - run: node verification/boss2-prelude-20261107/build.mjs
      - run: node verification/boss2-prelude-20261107/run.mjs continue-audio ${{ matrix.order }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: continue-audio-${{ matrix.order }}-${{ matrix.pair }}
          path: verification/boss2-prelude-20261107/results
          retention-days: 14
