name: Testnet collection live check
on:
  push:
    branches: [codex/collection-audit-20261005]
    paths: ['.github/workflows/collection-live-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install isolated Chromium
        run: npm install playwright@1.56.1 --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Anonymous public build and card verification; block all writes
        run: |
          mkdir live-evidence
          cat > live-check.cjs <<'JS'
          const {chromium}=require('playwright'),fs=require('fs'),assert=require('node:assert/strict'),crypto=require('crypto');
          (async()=>{
            const origin='https://cryptoid-evolution-testnet.vercel.app',r=await fetch(origin);assert.equal(r.status,200);
            const html=await r.text(),bundle=html.match(/src="(\/assets\/index-[^"]+\.js)"/)?.[1];assert.ok(bundle,'Expected game, not an authentication page');
            const code=await(await fetch(origin+bundle)).text();assert.ok(code.includes('data-background-state'));assert.ok(code.includes('Guest ship cards are stored on this device.'));
            const result={origin,publishedApplicationCommit:'f16ce1c0a8b8eb41045b5dcf168480f5169681b8',bundle,bundleSha256:crypto.createHash('sha256').update(code).digest('hex'),checkedAt:new Date().toISOString(),assets:[],cases:[]};
            for(const p of ['/ships/bosses/evolved/boss-04-hull.webp','/ships/bosses/evolved/boss-04-guns.webp']){const a=await fetch(origin+p);assert.equal(a.status,200);assert.equal(a.headers.get('content-type'),'image/webp');result.assets.push({path:p,bytes:(await a.arrayBuffer()).byteLength});}
            fs.writeFileSync('live-evidence/index.html',html);const browser=await chromium.launch();let page;const requests=[];
            try{
              for(const width of [390,1440]){
                const height=width===390?844:900,context=await browser.newContext({viewport:{width,height},locale:'de-DE',hasTouch:width===390});
                page=await context.newPage();page.setDefaultTimeout(60000);
                await page.addInitScript(()=>localStorage.setItem('cryptoid_language','de'));
                const blockedWrites=[],errors=[];page.on('pageerror',e=>errors.push(e.message));page.on('requestfailed',r=>requests.push({url:r.url(),error:r.failure()}));
                await page.route('**/*',route=>{const r=route.request();if(!['GET','HEAD'].includes(r.method())){blockedWrites.push(r.url());return route.abort();}return route.continue();});
                await page.goto(origin);await page.getByRole('button',{name:'✧ Sammelkarten'}).waitFor();await page.screenshot({path:`live-evidence/home-${width}.png`});
                await page.getByRole('button',{name:'✧ Sammelkarten'}).click();await page.locator('.collection-grid').waitFor();assert.equal(await page.locator('.collection-tile.is-locked').count(),50);
                await page.locator('.collection-tile').nth(3).click();await page.locator('.collection-locked-detail .boss-portrait').scrollIntoViewIfNeeded();
                await page.waitForFunction(()=>document.querySelector('.collection-locked-detail .boss-portrait')?.dataset.ready==='true',{},{timeout:60000});
                const art=await page.locator('.collection-locked-detail canvas').evaluate(c=>{const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;let colored=0,opaque=0;for(let i=0;i<d.length;i+=4)if(d[i+3]){opaque++;if(d[i]!==d[i+1]||d[i]!==d[i+2])colored++;}return{colored,opaque,guns:Number(c.dataset.turretCount)}});
                assert.equal(art.colored,0);assert.ok(art.opaque>1000&&art.guns>0);assert.equal(await page.locator('.collection-stats,.collection-download').count(),0);
                await page.screenshot({path:`live-evidence/locked-boss-${width}.png`});
                await page.keyboard.press('ArrowLeft');await page.locator('.collection-locked-detail .boss-portrait[data-boss-id="3"]').waitFor();
                await page.getByRole('button',{name:'← Zurück zur Sammlung'}).click();await page.getByRole('button',{name:'Standard',exact:true}).click();assert.equal(await page.locator('.collection-tile:not(.is-locked)').count(),1);
                await page.locator('.collection-tile:not(.is-locked)').click();const footer=await page.locator('.collection-footer').boundingBox();assert.ok(footer.y+footer.height<=height+1);
                await page.getByRole('button',{name:'Download vorbereiten'}).click();await page.locator('.collection-download').waitFor();const download=page.waitForEvent('download');await page.locator('.collection-download').click();await(await download).saveAs(`live-evidence/starter-card-${width}.png`);
                await page.screenshot({path:`live-evidence/starter-card-view-${width}.png`});assert.deepEqual(errors,[]);assert.equal(blockedWrites.filter(u=>/payment|order|progress\/inventory/.test(u)).length,0);
                result.cases.push({width,height,anonymous:true,art,ownershipGate:true,footerVisible:true,starterPngDownload:true,blockedWrites,pageErrors:errors});await context.close();page=null;
              }
              fs.writeFileSync('live-evidence/result.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result,null,2));
            }catch(e){if(page){await page.screenshot({path:'live-evidence/failure.png'}).catch(()=>{});fs.writeFileSync('live-evidence/failure.txt',await page.locator('body').innerText().catch(()=>''));}fs.writeFileSync('live-evidence/requests.json',JSON.stringify(requests,null,2));throw e;}
            finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node live-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testnet-collection-live-${{ github.run_id }}
          path: live-evidence/
          retention-days: 7
