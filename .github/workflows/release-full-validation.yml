name: Release validation
on:
  push:
    branches:
      - codex/package-7-localization
jobs:
  full-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: npm install --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: Install backend dependencies
        run: npm install --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Frontend tests
        run: find frontend/src -name '*.test.mjs' -print0 | xargs -0 node --experimental-strip-types --test --test-concurrency=2
      - name: Backend tests
        run: find backend/src -name '*.test.mjs' -print0 | xargs -0 node --experimental-strip-types --test --test-concurrency=2
      - name: Frontend release build
        run: npm run build --prefix frontend
      - name: Backend build
        run: npm run build --prefix backend
      - name: Frontend lint
        run: npm run lint --prefix frontend
