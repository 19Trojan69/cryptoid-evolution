name: Verify bounded player style write suppression
on:
  push:
    branches: [codex/ios-safari-environment-20261103]
    paths:
      - '.github/workflows/cryptoid-player-style-writes.yml'
      - 'verification/player-style-writes-20261103/candidate.mjs'
      - 'verification/player-style-writes-20261103/verify.mjs'
permissions:
  contents: read
jobs:
  native-css-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24'}
      - name: Install pinned tools outside the game
        run: |
          npm install --prefix "$RUNNER_TEMP/cryptoid-player-style-tools" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/cryptoid-player-style-tools/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Compare actual inline CSS semantics in both engines
        run: node verification/player-style-writes-20261103/verify.mjs . "$RUNNER_TEMP/cryptoid-player-style-results"
