name: Verify bounded original boss socket backing surfaces
on:
  push:
    branches: [codex/socket-surface-20261106]
    paths:
      - '.github/workflows/cryptoid-socket-surface.yml'
      - 'frontend/src/pages/bossWeaponRenderer.ts'
      - 'verification/socket-surface-20261106/**'
permissions:
  contents: read
jobs:
  pixels:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24'}
      - name: Check exact source scope and renderer syntax
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags --depth=1 origin 87f5dc28d1cb5054c0e40420848068eb0a156e56
          node --check frontend/src/pages/bossWeaponRenderer.ts
          node --check verification/socket-surface-20261106/native.mjs
          npm install --prefix verification/socket-surface-20261106 --ignore-scripts --no-audit --no-fund
      - name: Compare all 50 original weapon atlases on CPU
        run: node verification/socket-surface-20261106/cpu.mjs
      - name: Compare exact native Chromium pixels and release
        run: node verification/socket-surface-20261106/native.mjs chromium
      - name: Compare exact native WebKit pixels and release
        run: node verification/socket-surface-20261106/native.mjs webkit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: socket-surface-equivalence
          path: verification/socket-surface-20261106/results/
          retention-days: 7
