name: Verify reactor sequence, transition motion and bounded heat
on:
  push:
    branches: [codex/reactor-health-20261106]
    paths:
      - '.github/workflows/cryptoid-reactor-health.yml'
      - 'frontend/**'
      - 'verification/reactor-hit-20261106/**'
      - 'verification/reactor-health-20261106/**'
permissions:
  contents: read
jobs:
  reactor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24'}
      - name: Install frontend while preserving tracked lock
        run: |
          git fetch --no-tags --depth=1 origin d005c99b03dfdfe9433e300ac1add26a38a74eb9
          node --input-type=module - <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {spawnSync} from 'node:child_process';
          const p='frontend/yarn.lock',bytes=readFileSync(p);
          let r;try{r=spawnSync('npm',['install','--prefix','frontend','--include=optional','--ignore-scripts','--no-audit','--no-fund'],{stdio:'inherit'});}
          finally{writeFileSync(p,bytes);}
          if(r.status!==0)process.exit(r.status||1);
          JS
          git diff --exit-code -- frontend backend api vercel.json
      - name: Check all reactor/door/gun paths and original non-firing artwork
        run: |
          node --test verification/reactor-health-20261106/tracking.test.mjs verification/reactor-health-20261106/sequence.test.mjs frontend/src/pages/bossReactorTarget.test.mjs verification/reactor-hit-20261106/render.test.mjs frontend/src/pages/bossCore.test.mjs frontend/src/pages/bossSpecialWeapon.test.mjs frontend/src/pages/bossContact.test.mjs frontend/src/pages/specialPowers.test.mjs
      - name: Run all existing release checks, TypeScript and Vite
        env: {VERCEL_ENV: production, VITE_CRYPTOID_DIAGNOSTICS: "0"}
        run: |
          npm --prefix frontend run build
          git diff --exit-code -- frontend backend api vercel.json
  native-motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24'}
      - run: npm install --prefix verification/transition-motion-20261106 --ignore-scripts --no-audit --no-fund
      - run: npm install --prefix frontend --include=optional --ignore-scripts --no-audit --no-fund
      - run: node verification/reactor-health-20261106/native.mjs ${{ matrix.engine }}
      - run: node verification/reactor-health-20261106/ui-native.mjs ${{ matrix.engine }}
      - run: node verification/reactor-health-20261106/block-motion-native.mjs ${{ matrix.engine }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reactor-ui-${{ matrix.engine }}
          path: verification/reactor-health-20261106/results
          retention-days: 30
