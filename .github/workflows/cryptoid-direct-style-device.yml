name: Exact direct-style device Preview package
on:
  push:
    branches: [codex/direct-boss-style-device-20261102]
    paths:
      - '.github/workflows/cryptoid-direct-style-device.yml'
      - 'verification/direct-boss-style-device-20261102/*.mjs'
      - 'vercel.json'
permissions:
  contents: read
jobs:
  native-device-package-flow:
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24'}
      - name: Install exact declared browser tooling
        env: {VERCEL_ENV: preview}
        run: |
          node --input-type=module -e "import {readFileSync,writeFileSync} from 'node:fs'; writeFileSync('vercel.json', JSON.stringify(JSON.parse(readFileSync('vercel.json','utf8'))) + '\n');"
          node verification/direct-boss-style-device-20261102/installDevicePreview.mjs --ignore-scripts
          npm install --prefix verification/boss2-forensics-20261028 --ignore-scripts --no-audit --no-fund
          cd verification/boss2-forensics-20261028
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Verify exact package despite conflicting inherited build controls
        env:
          VERCEL_ENV: preview
          CRYPTOID_SOAK_CONDITION: mini-start
          CRYPTOID_LIFETIME_ATTRIBUTION: '0'
          CRYPTOID_LOCAL_STYLE_SCOPE: control
          CRYPTOID_LOCAL_STYLE_FIDELITY: '1'
          CRYPTOID_INACTIVE_NATIVE_TRACE: '1'
          CRYPTOID_STYLE_WRITE_PROBE: '1'
          CRYPTOID_UNKNOWN_INHERITED_SETTING: device-env-regression-marker
        run: |
          node verification/direct-boss-style-device-20261102/verifyScope.mjs
          node --test verification/direct-boss-style-device-20261102/verifyScope.test.mjs
          node --test verification/boss2-stopwatch-20261029/stopwatchState.test.mjs
          node verification/direct-boss-style-device-20261102/buildDevicePreview.mjs
          node verification/direct-boss-style-device-20261102/verifyPackage.mjs
      - name: Exercise actual minimal package without the new active trace hooks
        env:
          CRYPTOID_SOAK_CONDITION: original
          CRYPTOID_SOAK_ENGINE: ${{ matrix.engine }}
          CRYPTOID_SOAK_SECONDS: '60'
          CRYPTOID_SOAK_RUN: smoke
        run: node verification/systematic-stability-20261101/verifyBrowserSoak.mjs
      - name: Verify original runtime after the native flow
        if: ${{ !cancelled() }}
        run: |
          mkdir -p verification/direct-boss-style-device-20261102/results
          node verification/direct-boss-style-device-20261102/verifyScope.mjs > verification/direct-boss-style-device-20261102/results/source-scope-after.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: direct-style-device-${{ matrix.engine }}
          path: |
            verification/direct-boss-style-device-20261102/results/
            verification/systematic-stability-20261101/results/
            verification/boss2-forensics-20261028/results/device-preview/site/device-preview-info.json
          retention-days: 7
