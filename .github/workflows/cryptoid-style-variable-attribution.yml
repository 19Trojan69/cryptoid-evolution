name: Short CSS variable write attribution
on:
  push:
    branches: [codex/style-variable-attribution-20261102]
    paths:
      - '.github/workflows/cryptoid-style-variable-attribution.yml'
      - 'verification/style-variable-attribution-20261102/*.mjs'
      - 'verification/memory-retention-attribution-20261101/profileLifetime.mjs'
permissions:
  contents: read
jobs:
  source-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24'}
      - run: npm install --prefix frontend --include=optional --ignore-scripts --no-audit --no-fund
      - name: Test real observer forwarding, bounded state and restoration before any game capture
        run: |
          git restore --worktree -- frontend/yarn.lock
          node verification/boss2-mini-start-control-20261101/verifyScope.mjs
          node --test verification/style-variable-attribution-20261102/styleWriteProbe.test.mjs verification/memory-retention-attribution-20261101/inspection.test.mjs verification/inactive-native-allocation-20261101/collector.test.mjs verification/boss2-native-memory-20261029/nativeSummary.test.mjs
          node verification/memory-retention-attribution-20261101/preflight.mjs
          node verification/inactive-native-allocation-20261101/evidence/verifyEvidence.mjs
  short-attribution:
    needs: source-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CRYPTOID_SOAK_CONDITION: original
      CRYPTOID_LIFETIME_ATTRIBUTION: '1'
      CRYPTOID_STYLE_WRITE_PROBE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24'}
      - name: Install existing browser tools
        run: |
          npm install --prefix frontend --include=optional --ignore-scripts --no-audit --no-fund
          npm install --prefix verification/boss2-forensics-20261028 --ignore-scripts --no-audit --no-fund
          git restore --worktree -- frontend/yarn.lock
          cd verification/boss2-forensics-20261028
          npx playwright install --with-deps chromium
      - name: Observe one active minute, restore native APIs, then verify existing inactive boundaries
        env: {VERCEL_ENV: preview, CRYPTOID_ATTRIBUTION_SECONDS: '60'}
        run: |
          node verification/systematic-stability-20261101/prepareSoakBuild.mjs
          node verification/memory-retention-attribution-20261101/profileLifetime.mjs
          node verification/boss2-mini-start-control-20261101/verifyScope.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: short-style-write-attribution
          path: verification/style-variable-attribution-20261102/results/
          retention-days: 7
