name: Private smartphone rendering comparison
run-name: Verify narrow and wide display paths and existing reduced effects in both engines
on:
  push:
    branches: [codex/boss2-heap-retention-20261029]
    paths: ['.github/workflows/cryptoid-smartphone-render.yml']
permissions:
  contents: read
jobs:
  rendering:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Install existing pinned tools
        run: |
          npm install --prefix frontend --ignore-scripts --no-audit --no-fund
          npm install --prefix verification/boss2-forensics-20261028 --ignore-scripts --no-audit --no-fund
          cd verification/boss2-forensics-20261028
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Preserve existing application inputs
        run: |
          node verification/boss2-return-duration-20261029/verifyScope.mjs
          node --experimental-strip-types verification/boss2-forensics-20261028/devicePreviewPreflight.mjs
          node --check verification/boss2-heap-retention-20261029/verifySmartphone.mjs
      - name: Build the unchanged private application
        env:
          VERCEL_ENV: preview
        run: node verification/boss2-forensics-20261028/buildDevicePreview.mjs
      - name: Compare four fresh display conditions with native touch
        env:
          CRYPTOID_SMARTPHONE_ENGINE: ${{ matrix.engine }}
        run: node --experimental-strip-types verification/boss2-heap-retention-20261029/verifySmartphone.mjs
      - name: Preserve synthetic rendering evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smartphone-render-${{ matrix.engine }}
          path: verification/boss2-heap-retention-20261029/results/render-${{ matrix.engine }}/
          retention-days: 3
