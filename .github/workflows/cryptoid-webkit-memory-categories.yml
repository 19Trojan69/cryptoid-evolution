name: Attribute WebKit native memory categories and layers
on:
  push:
    branches: [codex/webkit-memory-categories-20261105]
    paths:
      - '.github/workflows/cryptoid-webkit-memory-categories.yml'
      - 'verification/webkit-memory-categories-20261105/**'
permissions:
  contents: read
concurrency:
  group: webkit-memory-categories-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24'}
      - name: Validate new driver and original protected source
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          node --check verification/webkit-memory-categories-20261105/run.mjs
          node verification/direct-boss-style-device-20261102/verifyScope.mjs
      - name: Install original application and use preinstalled matching WebKit
        env: {VERCEL_ENV: preview}
        run: |
          npm install --prefix verification/boss2-forensics-20261028 --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./verification/boss2-forensics-20261028/node_modules/playwright');if(!require('fs').existsSync(p.webkit.executablePath()))process.exit(1)"
          node verification/direct-boss-style-device-20261102/installDevicePreview.mjs --ignore-scripts
          node verification/player-muzzle-webkit-device-20261105/build.mjs
      - name: Record native category and layer attribution with context-close control
        run: |
          node verification/webkit-memory-categories-20261105/run.mjs
          node verification/direct-boss-style-device-20261102/verifyScope.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: webkit-memory-categories
          path: verification/webkit-memory-categories-20261105/results/
          retention-days: 7
