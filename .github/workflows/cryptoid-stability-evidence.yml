name: Stability evidence integrity
on:
  push:
    branches: [codex/inactive-native-allocation-20261101, codex/style-variable-attribution-20261102, codex/boss-thrust-scope-20261102, codex/active-pressure-attribution-20261102, codex/active-blink-detail-20261102]
    paths:
      - '.github/workflows/cryptoid-stability-evidence.yml'
      - 'verification/inactive-native-allocation-20261101/evidence/**'
      - 'verification/isolated-mini-pacing-20261101/evidence/**'
      - 'verification/memory-retention-attribution-20261101/evidence/**'
      - 'verification/boss2-native-memory-20261029/nativeSummary*'
      - 'verification/style-variable-attribution-20261102/evidence/**'
      - 'verification/boss-thrust-scope-20261102/evidence/**'
      - 'verification/active-pressure-attribution-20261102/evidence/**'
      - 'verification/active-blink-detail-20261102/evidence/**'
permissions:
  contents: read
jobs:
  offline-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24'}
      - name: Reparse archived synthetic evidence without another game soak
        run: |
          node verification/boss2-mini-start-control-20261101/verifyScope.mjs
          node --test verification/inactive-native-allocation-20261101/evidence/summary.test.mjs verification/isolated-mini-pacing-20261101/evidence/summary.test.mjs verification/memory-retention-attribution-20261101/evidence/attributionSummary.test.mjs verification/boss2-native-memory-20261029/nativeSummary.test.mjs verification/style-variable-attribution-20261102/styleWriteProbe.test.mjs verification/style-variable-attribution-20261102/evidence/summary.test.mjs
          node --test verification/boss-thrust-scope-20261102/evidence/summary.test.mjs
          node --test verification/active-pressure-attribution-20261102/collector.test.mjs verification/active-pressure-attribution-20261102/evidence/summary.test.mjs
          node --test verification/active-blink-detail-20261102/collector.test.mjs verification/active-blink-detail-20261102/evidence/summary.test.mjs
          node verification/memory-retention-attribution-20261101/evidence/verifyEvidence.mjs
          node verification/isolated-mini-pacing-20261101/evidence/verifyEvidence.mjs
          node verification/inactive-native-allocation-20261101/evidence/verifyEvidence.mjs
          node verification/style-variable-attribution-20261102/evidence/verifyEvidence.mjs
          node verification/boss-thrust-scope-20261102/evidence/verifyEvidence.mjs
          node verification/active-pressure-attribution-20261102/evidence/verifyEvidence.mjs
          node verification/active-blink-detail-20261102/evidence/verifyEvidence.mjs
