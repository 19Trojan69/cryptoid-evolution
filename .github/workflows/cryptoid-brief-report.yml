name: Protected brief report
run-name: Verify bounded recorder-off reports and preserved game lifecycle
on:
  push:
    branches: [codex/boss2-brief-report-20261030]
    paths: ['.github/workflows/cryptoid-brief-report.yml', 'verification/boss2-brief-report-20261030/**', 'verification/boss2-forensics-20261028/devicePreviewApp.jsx', 'verification/boss2-stopwatch-20261029/stopwatchBrowser.mjs', 'vercel.json']
permissions:
  contents: read
jobs:
  brief-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Install existing pinned browser tools
        run: |
          npm install --prefix frontend --ignore-scripts --no-audit --no-fund
          npm install --prefix verification/boss2-forensics-20261028 --ignore-scripts --no-audit --no-fund
          # npm updates this tracked Yarn metadata during this clean CI install.
          # Restore only that generated lockfile before the strict source check.
          git restore --worktree -- frontend/yarn.lock
          cd verification/boss2-forensics-20261028
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Verify bounded diagnostics and unchanged entire game source
        run: |
          node --test verification/boss2-brief-report-20261030/briefState.test.mjs
          node verification/boss2-brief-report-20261030/verifyScope.mjs
          node --experimental-strip-types verification/boss2-forensics-20261028/devicePreviewPreflight.mjs
      - name: Build protected brief report preview
        env:
          VERCEL_ENV: preview
        run: node verification/boss2-brief-report-20261030/buildBriefPreview.mjs
      - name: Verify active reload, stopwatch pairing, contacts, download, share and pause
        env:
          CRYPTOID_BRIEF_ENGINE: ${{ matrix.engine }}
        run: node --experimental-strip-types verification/boss2-brief-report-20261030/verifyBriefPreview.mjs
      - name: Preserve synthetic evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: brief-report-${{ matrix.engine }}
          path: verification/boss2-brief-report-20261030/results/${{ matrix.engine }}/
          retention-days: 3
