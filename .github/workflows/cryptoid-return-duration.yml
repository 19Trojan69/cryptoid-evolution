name: Private Boss 2 six-minute return investigation
run-name: Six-minute active Boss 2 and Linux process-memory comparison
on:
  push:
    branches: [codex/boss2-return-duration-20261029]
    paths: ['.github/workflows/cryptoid-return-duration.yml']
permissions:
  contents: read
jobs:
  duration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Install pinned existing verification tools
        run: |
          npm install --prefix frontend --ignore-scripts --no-audit --no-fund
          npm install --prefix verification/boss2-forensics-20261028 --ignore-scripts --no-audit --no-fund
          cd verification/boss2-forensics-20261028
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Preserve reviewed application and isolated API
        run: |
          node verification/boss2-return-duration-20261029/verifyScope.mjs
          node --experimental-strip-types --test verification/boss2-forensics-20261028/devicePreview.test.mjs verification/boss2-forensics-20261028/deviceReturnEvidence.test.mjs verification/boss2-forensics-20261028/tools.test.mjs private-preview/isolation.test.mjs
          node --experimental-strip-types verification/boss2-forensics-20261028/devicePreviewPreflight.mjs
      - name: Build the unchanged private application
        env:
          VERCEL_ENV: preview
        run: node verification/boss2-forensics-20261028/buildDevicePreview.mjs
      - name: Observe six minutes without in-game interaction
        env:
          CRYPTOID_DURATION_ENGINE: ${{ matrix.engine }}
          CRYPTOID_DURATION_SECONDS: '360'
        run: node --experimental-strip-types verification/boss2-return-duration-20261029/verifyDuration.mjs
      - name: Preserve synthetic duration evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boss2-return-duration-${{ matrix.engine }}
          path: verification/boss2-return-duration-20261029/results/${{ matrix.engine }}/
          retention-days: 3
