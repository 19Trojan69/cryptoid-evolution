name: Attribute remaining native style work in a short active game
on:
  push:
    branches: [codex/active-render-profile-20261105]
    paths:
      - '.github/workflows/cryptoid-active-render-profile.yml'
      - 'verification/active-render-profile-20261105/**'
permissions:
  contents: read
concurrency:
  group: active-render-profile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  short-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24'}
      - name: Guard source and native parser
        run: |
          node --test verification/active-render-profile-20261105/trace.test.mjs
          node --check verification/active-render-profile-20261105/run.mjs
          node verification/direct-boss-style-device-20261102/verifyScope.mjs
      - name: Install existing application and Chromium
        env: {VERCEL_ENV: preview}
        run: |
          node verification/direct-boss-style-device-20261102/installDevicePreview.mjs --ignore-scripts
          npm install --prefix verification/boss2-forensics-20261028 --ignore-scripts --no-audit --no-fund
          cd verification/boss2-forensics-20261028
          npx playwright install --with-deps chromium
      - name: Build existing device renderer and capture short native profile
        env: {VERCEL_ENV: preview}
        run: |
          node verification/player-muzzle-webkit-device-20261105/build.mjs
          node verification/active-render-profile-20261105/run.mjs
          node verification/direct-boss-style-device-20261102/verifyScope.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: active-render-profile
          path: verification/active-render-profile-20261105/results/
          retention-days: 7
