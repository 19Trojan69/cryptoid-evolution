name: Private smartphone native memory attribution
run-name: Complete restricted Chromium memory attribution after verified WebKit profiles
on:
  push:
    branches: [codex/boss2-native-memory-20261029]
    paths: ['.github/workflows/cryptoid-native-memory.yml']
permissions:
  contents: read
jobs:
  attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium]
        effects: [standard, reduced]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Install existing pinned tools
        run: |
          npm install --prefix frontend --ignore-scripts --no-audit --no-fund
          npm install --prefix verification/boss2-forensics-20261028 --ignore-scripts --no-audit --no-fund
          cd verification/boss2-forensics-20261028
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Validate attribution parser and unchanged application
        run: |
          node --test verification/boss2-native-memory-20261029/nativeSummary.test.mjs
          node verification/boss2-return-duration-20261029/verifyScope.mjs
          node --experimental-strip-types verification/boss2-forensics-20261028/devicePreviewPreflight.mjs
      - name: Build the unchanged private application
        env:
          VERCEL_ENV: preview
        run: node verification/boss2-forensics-20261028/buildDevicePreview.mjs
      - name: Attribute native memory during the existing scene
        env:
          CRYPTOID_NATIVE_ENGINE: ${{ matrix.engine }}
          CRYPTOID_NATIVE_EFFECTS: ${{ matrix.effects }}
        run: node --experimental-strip-types verification/boss2-native-memory-20261029/profileNative.mjs
      - name: Preserve synthetic native attribution evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-memory-${{ matrix.engine }}-${{ matrix.effects }}
          path: verification/boss2-native-memory-20261029/results/${{ matrix.engine }}-${{ matrix.effects }}/
          retention-days: 3
