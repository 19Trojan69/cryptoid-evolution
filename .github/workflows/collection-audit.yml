name: Collection audit
on:
  push:
    branches: [codex/collection-audit-20261005, codex/level-expansion-v2]
    paths: ['frontend/**', 'backend/**', '.github/workflows/collection-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: collection-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app dependencies (same installer as vercel.json)
        run: npm install --prefix frontend --no-audit --no-fund && npm install --prefix backend --no-audit --no-fund
      - name: Backend build and tests
        run: |
          mkdir -p audit-output
          set -o pipefail
          npm run build --prefix backend 2>&1 | tee audit-output/backend-build.txt
          (cd backend && find src -name '*.test.mjs' -print0 | xargs -0 node --experimental-strip-types --test) 2>&1 | tee audit-output/backend-tests.txt
      - name: Frontend tests and production build
        run: |
          set -o pipefail
          (cd frontend && find src -name '*.test.mjs' -print0 | xargs -0 node --experimental-strip-types --test) 2>&1 | tee audit-output/frontend-tests.txt
          npm run build --prefix frontend 2>&1 | tee audit-output/frontend-build.txt
      - name: Install isolated browser
        run: |
          npm install --prefix .audit-tools --no-save --no-audit --no-fund playwright@1.56.1
          .audit-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify purchases, silhouettes, responsive controls and all card exports
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ github.workspace }}/.audit-tools/node_modules/playwright
        run: set -o pipefail; node frontend/scripts/verifyCollectionAudit.cjs 2>&1 | tee audit-output/browser-log.txt
      - name: Record tested source
        if: always()
        run: mkdir -p audit-output && git rev-parse HEAD > audit-output/verified-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collection-evidence-${{ github.sha }}
          path: audit-output/
          retention-days: 7
