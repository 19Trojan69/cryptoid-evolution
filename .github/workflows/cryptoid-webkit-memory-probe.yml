name: WebKit content-process visibility
run-name: WebKit content memory after a natural campaign prelude

on:
  push:
    branches: [codex/boss2-forensics-20261028]
    paths: ['.github/workflows/cryptoid-webkit-memory-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-process:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CRYPTOID_TEST_PROFILE: iphone
      CRYPTOID_FORENSIC_MODE: warm
      CRYPTOID_GESTURE_EVIDENCE: '1'
      CRYPTOID_WARMUP_MAX_SECONDS: '1200'
      CRYPTOID_CASE_SECONDS: '10'
      CRYPTOID_TEST_OUTPUT: ${{ github.workspace }}/verification/boss2-forensics-20261028/results/webkit-content-probe
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Prepare unchanged source and real-handler fixture
        run: |
          npm install --prefix frontend --include=optional --no-audit --no-fund
          npm ci --prefix backend --include=optional --ignore-scripts
          npm run build --prefix backend
          npm run prepare:hulls --prefix frontend
          npm install --prefix verification/boss2-forensics-20261028 --ignore-scripts --no-audit --no-fund
          cd verification/boss2-forensics-20261028
          npx playwright install --with-deps webkit
      - name: Validate sampler and instrumented source
        run: |
          node --test verification/boss2-forensics-20261028/tools.test.mjs
          node --experimental-strip-types verification/boss2-forensics-20261028/preflight.mjs
      - name: Verify content process is actually measured
        run: node verification/boss2-forensics-20261028/run.mjs
      - name: Retain scoped measurement evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: webkit-content-visibility
          path: |
            verification/boss2-forensics-20261028/results/webkit-content-probe/summary.json
            verification/boss2-forensics-20261028/results/webkit-content-probe/events.jsonl
            verification/boss2-forensics-20261028/results/webkit-content-probe/process-memory.jsonl
            verification/boss2-forensics-20261028/results/webkit-content-probe/*.png
          retention-days: 3
