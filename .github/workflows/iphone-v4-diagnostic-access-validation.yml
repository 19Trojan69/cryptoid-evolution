name: iPhone V4 diagnostic access validation

on:
  push:
    branches:
      - codex/iphone-resource-trend-v4-20261019
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: Build backend
        working-directory: backend
        run: npm run build
      - name: Backend access and gateway tests
        working-directory: backend
        run: node --test src/apiGateway.test.mjs src/adminAccess.test.mjs
      - name: Install frontend
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Frontend diagnostic tests
        working-directory: frontend
        run: node --experimental-strip-types --test src/pages/reloadDiagnostics.test.mjs src/pages/resourceCacheDiagnostics.test.mjs src/hooks/useAuth.test.mjs
      - name: Frontend report and recovery tests
        working-directory: frontend
        run: node --experimental-strip-types --test scripts/stabilityReport.test.mjs scripts/ownerStabilityReport.test.mjs src/pages/gameLoop.test.mjs src/pages/diagnosticExport.test.mjs
