name: Protected smartphone stopwatch
run-name: Verify final stopwatch display, frozen end and restored checkpoint
on:
  push:
    branches: [codex/boss2-stopwatch-20261029]
    paths: ['.github/workflows/cryptoid-stopwatch.yml']
permissions:
  contents: read
jobs:
  stopwatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Install existing pinned browser tools
        run: |
          npm install --prefix frontend --ignore-scripts --no-audit --no-fund
          npm install --prefix verification/boss2-forensics-20261028 --ignore-scripts --no-audit --no-fund
          cd verification/boss2-forensics-20261028
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Verify state and unchanged game
        run: |
          node --test verification/boss2-stopwatch-20261029/stopwatchState.test.mjs
          node --check verification/boss2-stopwatch-20261029/stopwatchBrowser.mjs
          node --check verification/boss2-stopwatch-20261029/verifyStopwatch.mjs
          node verification/boss2-return-duration-20261029/verifyScope.mjs
          node --experimental-strip-types verification/boss2-forensics-20261028/devicePreviewPreflight.mjs
      - name: Build protected CSS-off stopwatch preview
        env:
          VERCEL_ENV: preview
        run: node verification/boss2-stopwatch-20261029/buildStopwatchPreview.mjs
      - name: Verify native stopwatch lifecycle
        env:
          CRYPTOID_STOPWATCH_ENGINE: ${{ matrix.engine }}
        run: node --experimental-strip-types verification/boss2-stopwatch-20261029/verifyStopwatch.mjs
      - name: Preserve synthetic stopwatch evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stopwatch-${{ matrix.engine }}
          path: verification/boss2-stopwatch-20261029/results/${{ matrix.engine }}/
          retention-days: 3
