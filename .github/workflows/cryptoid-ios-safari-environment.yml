name: Native Safari environment control without game code
on:
  push:
    branches: [codex/ios-safari-environment-20261103]
    paths:
      - '.github/workflows/cryptoid-ios-safari-environment.yml'
      - 'verification/ios-safari-environment-20261103/*.mjs'
permissions:
  contents: read
jobs:
  safari-control:
    strategy:
      fail-fast: false
      matrix:
        runtime: ['18.5']
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false, path: lab}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24'}
      - name: Validate the control script syntax
        run: |
          node --check lab/verification/ios-safari-environment-20261103/probe.mjs
          node --test lab/verification/ios-safari-environment-20261103/locateWda.test.mjs
      - name: Initialize the preinstalled simulator catalogue before loading Appium
        timeout-minutes: 3
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          python3 - <<'PY'
          import subprocess,json,time,os
          from pathlib import Path
          started=time.monotonic()
          result=subprocess.run(['xcrun','simctl','list','--json'],capture_output=True,text=True,check=True,timeout=150)
          inventory=json.loads(result.stdout)
          destination=Path(os.environ['RUNNER_TEMP'])/'cryptoid-simulator-inventory.json'
          destination.write_text(result.stdout)
          print('CRYPTOID_IOS_SDK_CATALOGUE '+json.dumps({'elapsedMs':round((time.monotonic()-started)*1000),'gameLoaded':False,'availableRuntimes':[{'version':r['version'],'identifier':r['identifier']} for r in inventory['runtimes'] if r.get('isAvailable')]}))
          PY
      - name: Install pinned free native test tools outside the checkout
        run: |
          export APPIUM_HOME="$RUNNER_TEMP/cryptoid-appium-home"
          printf 'APPIUM_HOME=%s\n' "$APPIUM_HOME" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/cryptoid-appium-tools" --no-audit --no-fund appium@3.9.0
          "$RUNNER_TEMP/cryptoid-appium-tools/node_modules/.bin/appium" driver install xcuitest@12.22.8
      - name: Inspect native Safari and require a trusted touch on constant local HTML
        run: node lab/verification/ios-safari-environment-20261103/probe.mjs lab/verification/ios-safari-environment-20261103/results '${{ matrix.runtime }}'
