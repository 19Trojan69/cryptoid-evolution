name: Native Safari environment control without game code
on:
  push:
    branches: [codex/ios-safari-environment-20261103]
    paths:
      - '.github/workflows/cryptoid-ios-safari-environment.yml'
      - 'verification/ios-safari-environment-20261103/*.mjs'
permissions:
  contents: read
jobs:
  safari-control:
    strategy:
      fail-fast: false
      matrix:
        runtime: ['18.5', '26.2']
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false, path: lab}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24'}
      - name: Validate the control script syntax
        run: node --check lab/verification/ios-safari-environment-20261103/probe.mjs
      - name: Install pinned free native test tools outside the checkout
        run: |
          export APPIUM_HOME="$RUNNER_TEMP/cryptoid-appium-home"
          printf 'APPIUM_HOME=%s\n' "$APPIUM_HOME" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/cryptoid-appium-tools" --no-audit --no-fund appium@3.9.0
          "$RUNNER_TEMP/cryptoid-appium-tools/node_modules/.bin/appium" driver install xcuitest@12.22.8
      - name: Select preinstalled Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
      - name: Inspect native Safari and require a trusted touch on constant local HTML
        run: node lab/verification/ios-safari-environment-20261103/probe.mjs lab/verification/ios-safari-environment-20261103/results '${{ matrix.runtime }}'
