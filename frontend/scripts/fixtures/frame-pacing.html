<!doctype html>
<html lang="de"><meta charset="utf-8"><title>Cryptoid · 60-Hz-Animationsprüfung</title>
<style>
body{background:#071622;color:#edf7fb;font:16px system-ui;padding:24px} .box{width:24px;height:24px;background:#d8c18a;margin:8px}
@keyframes travel{from{transform:translateX(0)}to{transform:translateX(100px)}}
.finite{animation:travel .25s linear forwards}.infinite{animation:travel 1s linear infinite alternate}.pause{animation-play-state:paused}
.pseudo::after{content:"";display:block;width:12px;height:12px;background:cyan;animation:travel 1s linear infinite}.transition{transition:margin-left .25s linear}
pre{white-space:pre-wrap}li{margin:8px}
</style>
<h1>Cryptoid · Gemeinsamer 60-Hz-Takt</h1><p>Kontrollierte Browserprüfung der echten Animationssteuerung. Keine Aussage über iPhone-Temperatur.</p>
<div id="fixture"><div class="box infinite" id="infinite"></div><div class="box finite" id="finite"></div><div class="box pseudo" id="pseudo"></div><div class="box transition" id="transition"></div><div class="box" id="web"></div></div>
<ol id="checks"></ol><pre id="result">Prüfung läuft …</pre>
<script type="module">
import {startCssFramePacing,paceAnimation} from '/src/lib/cssFramePacing.ts';
const root=document.querySelector('#fixture'), output=document.querySelector('#result'), checks=[];
const check=(name,passed,detail={})=>{checks.push({name,passed,...detail});const row=document.createElement('li');row.textContent=`${passed?'PASS':'FAIL'} · ${name} · ${JSON.stringify(detail)}`;document.querySelector('#checks').append(row);};
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
let animationEnds=0,transitionEnds=0;
root.addEventListener('animationend',event=>{if(event.target.id==='finite')animationEnds++;});
root.addEventListener('transitionend',()=>transitionEnds++);
const stop=startCssFramePacing(root);
try {
 await wait(70);
 const infinite=document.querySelector('#infinite'), anim=infinite.getAnimations()[0];
 check('CSS-Animationen am gemeinsamen Takt',anim.playbackRate===0);
 const pseudo=document.querySelector('#pseudo').getAnimations()[0];
 check('Pseudoelemente erfasst',pseudo?.playbackRate===0);
 const points=[];let sampling=true;
 const sample=()=>{points.push(Number(anim.currentTime));if(sampling)requestAnimationFrame(sample);};requestAnimationFrame(sample);
 const web=paceAnimation(document.querySelector('#web').animate([{opacity:0},{opacity:1}],{duration:180,fill:'forwards'}));
 let webFinished=false;web.finished.then(()=>{webFinished=true;});
 document.querySelector('#transition').style.marginLeft='100px';
 await wait(450);sampling=false;
 check('Endliche CSS-Animation beendet und animationend genau einmal',animationEnds===1&&document.querySelector('#finite').getAnimations()[0]?.playState==='finished',{animationEnds});
 check('Transition beendet und transitionend genau einmal',transitionEnds===1,{transitionEnds});
 check('Web-Animation beendet und Promise erfüllt',webFinished&&web.playState==='finished',{webFinished});
 infinite.classList.add('pause');await wait(60);const paused=Number(anim.currentTime);await wait(180);
 check('CSS-Pause bleibt stehen',Math.abs(Number(anim.currentTime)-paused)<1,{paused,current:Number(anim.currentTime)});
 infinite.classList.remove('pause');await wait(140);
 check('CSS-Wiederaufnahme bewegt sich weiter',Number(anim.currentTime)>paused+70,{delta:Number(anim.currentTime)-paused});
 const changes=points.filter((value,i)=>i===0||value!==points[i-1]).length;
 check('CSS-Zeit wird fortgeschrieben',changes>10,{samples:points.length,changes});
 infinite.remove();document.querySelector('#pseudo').remove();await wait(50);
 stop();check('Aufräumen stellt ursprüngliche Abspielrate wieder her',anim.playbackRate===1,{rate:anim.playbackRate});
 output.textContent=JSON.stringify({passed:checks.every(check=>check.passed),checks},null,2);
}catch(error){stop();output.textContent=JSON.stringify({passed:false,error:String(error),checks},null,2);}
</script></html>
